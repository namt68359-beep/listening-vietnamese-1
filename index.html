["0:02","Hà Nội đây. Trong series 24 giờ ở Hà Nội này thì mời các bác theo chân tôi khám phá mảnh đất từ một người đã sinh ra và lớn lên ở đây nha.","This is Hanoi. In this series, come along as I explore the city as someone born and raised here."],
["0:10","Sáng nay thì tôi có ghé phở Lâm Hàng Vải. Quán này chỉ một buổi sáng thôi và hết hàng cực nhanh.","This morning I dropped by Phở Lâm. It only opens in the morning and sells out very fast."],
["0:13","Ở đây thì nhất định phải gọi phở Lâm, phải nói là số một trong lòng tôi luôn. Nước dùng thanh và nêm nếm rất vừa phải, chỉ 65k một bát nhưng no đến chiều.","You must order phở here – number one in my heart. Light broth, well seasoned, only 65k a bowl but it keeps you full until afternoon."],
["0:20","Ăn sáng xong thì phải uống cà phê. Thế nên là tôi đã ghé qua cà phê Nhĩ. Đây là một trong tứ trụ cà phê tại Hà Nội vì quán vẫn giữ được hương vị xưa cũ từ chiếc ghế đến biển hiệu và đặc biệt là cà phê.","After breakfast, coffee. So I stopped by Cà phê Nhĩ, one of Hanoi's four coffee pillars: it keeps its old flavour, from the chairs to the sign, and above all the coffee."],
["0:28","Bác nào mà không uống được quá nhiều cà phê như tôi thì có thể gọi một cốc nâu đá để nhâm nhi nha.","If you can't drink much coffee like me, order an iced nâu đá to sip slowly."],
["0:35","Rồi đến Hà Nội nhất định phải thử kem Tràng Tiền. Giờ ở đây đã có thêm rất nhiều vị kem mới lạ và còn có cả cơ sở mới nữa.","Then, in Hanoi you must try Tràng Tiền ice cream. Now there are many new flavours and even a new branch."],
["0:43","Cuối buổi thì tôi có ghé qua bưu điện Hà Nội. Đây vừa là chỗ nghỉ ngơi mà còn nhìn thẳng ra hồ Gươm luôn. Quanh khu vực này thì cũng bán rất nhiều đồ lưu niệm mang đậm dấu ấn Hà Nội như móc khóa, nam châm hay là thiệp này rất là xinh luôn.","At the end I dropped by the Hanoi post office: a place to rest that faces Hồ Gươm. Nearby they sell many Hanoi-flavoured souvenirs: keychains, magnets, very pretty cards."],
["0:53","Nay du lịch Hà Nội nên là tôi đã quyết định di chuyển hoàn toàn bằng Green SM. Trước đây là Xanh SM, gọi xe rất nhanh chóng và dễ dàng.","Today I decided to get around entirely by Green SM (formerly Xanh SM). Booking is quick and easy."],
["1:01","Tổng kết hôm nay đặt Green SM di chuyển tận ba điểm. Như thế là hết 107k nhưng áp mã được cả ba lần luôn.","Today I booked three trips: 107k in total, but I used a discount code on all three."],
["1:06","Đi từ tận Cầu Giấy lên Hàng Vải hết 52k, giảm còn 43k. Rồi từ Hàng Vải lên kem Tràng Tiền từ 18k còn 15k. Xong từ Hồ Gươm về nhà tôi 59k cũng chỉ còn 49k.","Cầu Giấy to Hàng Vải: 52k, down to 43k. Hàng Vải to the ice cream: 18k to 15k. Hồ Gươm home: 59k down to 49k."],
["1:17","Tổng tiết kiệm được tận 22k. Ngày nào cũng đều đều như thế này thì chắc một tháng cũng phải được gần 700k đấy nhỉ.","Total saved: 22k. Doing this every day, that's probably nearly 700k a month."],
["1:20","À nếu mà bác nào cũng di chuyển nhiều như tôi thì trên Green SM còn có gói hội viên Green Buy chỉ từ 20k một tháng, có tận 60 mã giảm 20%. Sương sương là mỗi tháng sẽ tiết kiệm được gần hai củ so với book lẻ luôn.","If you travel a lot like me, there's a membership from 20k a month with 60 codes at 20% off. Roughly, you save nearly 2 million a month versus booking single rides."],
["1:32","Nay tôi gọi Green SM thì thấy các bác tài hầu như đều đi xe mới, chạy êm và cũng rất nhiệt tình nữa. Đấy, thế nên là khám phá Hà Nội mà không rành đường thì các bác có thể tải app Green SM để tiện di chuyển.","The drivers mostly have new, smooth cars and are friendly. So if you don't know the roads, download the app."],
["1:43","Nhắc nhỏ là các bác đăng ký tài khoản mới và nhập mã giới thiệu KOL Hà Nội là có thể nhận thêm ưu đãi lên tới 200k nha. Và giờ thì bye, hẹn các bác một ngày gần nhất lại cùng khám phá Hà Nội với tôi nhá.","Reminder: new accounts with the code get up to 200k extra. Bye – see you next time!"]];

const L1=[["Buổi sáng, người nói đi ăn gì?",["Bún chả","Phở","Bánh mì","Xôi"],1],["Quán phở chỉ bán vào lúc nào?",["Buổi sáng","Buổi trưa","Buổi tối","Cả ngày"],0],["Một bát phở giá bao nhiêu?",["45k","55k","65k","75k"],2],["Người nói nhận xét nước dùng như thế nào?",["Rất cay","Rất ngọt","Thanh và nêm nếm vừa phải","Rất mặn"],2],["Sau khi ăn sáng, người nói đi đâu?",["Đi mua sắm","Đi uống cà phê","Đi xem phim","Đi về nhà"],1],["Người nói gợi ý gọi loại cà phê nào?",["Bạc xỉu","Cà phê đen nóng","Nâu đá","Cà phê trứng"],2],["Vì sao người nói gợi ý nâu đá?",["Vì thích cà phê nóng","Vì không uống được quá nhiều cà phê","Vì nâu đá rẻ hơn","Vì quán chỉ có nâu đá"],1],["Sau khi uống cà phê, người nói đi đâu?",["Hồ Tây","Chợ Đồng Xuân","Kem Tràng Tiền","Văn Miếu"],2],["Ở khu vực Hồ Gươm, người nói có thể mua gì?",["Đồ điện tử","Đồ lưu niệm","Quần áo thể thao","Thực phẩm"],1],["Người nói dùng phương tiện gì để di chuyển?",["Xe buýt","Taxi truyền thống","Green SM","Tàu điện"],2]];

const L3=[["Vì sao quán cà phê vẫn giữ được “hương vị xưa cũ”?",["Vì quán mới mở","Vì quán giữ nhiều nét cũ từ chiếc ghế, biển hiệu đến cà phê","Vì quán rất lớn","Vì quán nằm ngoài Hà Nội"],1],["Cụm “no đến chiều” có nghĩa là gì?",["Ăn rất chậm","Ăn xong vẫn đói","Ăn một lần nhưng no trong thời gian dài","Ăn vào buổi chiều"],2],["Vì sao người nói chọn di chuyển bằng Green SM?",["Vì muốn thử phương tiện mới","Vì gọi xe nhanh và dễ dàng","Vì không biết đi xe máy","Vì không có phương tiện khác"],1]];
const mk=a=>a.map(([q,o,a,e])=>({q,o,a,e}));
const has=(t,r)=>r.test(t);
const SK=[{q:"Nếu bạn có 24 giờ ở Hà Nội, bạn sẽ đi đâu? (nêu ít nhất 3 nơi)",ok:t=>(t.match(/,|;| và /g)||[]).length>=2,h:"Name at least 3 places, separated by commas or “và”."},{q:"Bạn sẽ ăn gì? (Tôi sẽ …)",ok:t=>/tôi sẽ\s+\S+/i.test(t),h:"Start with “Tôi sẽ …”."},{q:"Bạn sẽ uống gì? (Tôi sẽ …)",ok:t=>/tôi sẽ\s+\S+/i.test(t)&&/uống/i.test(t),h:"Use “Tôi sẽ uống …”."},{q:"Bạn sẽ di chuyển bằng gì? (Tôi sẽ đi bằng …)",ok:t=>/đi bằng\s+\S+/i.test(t),h:"Use “Tôi sẽ đi bằng …”."},{q:"Lịch trình: Buổi sáng, tôi sẽ… Sau đó… Buổi trưa… Buổi chiều… Buổi tối…",ok:t=>/buổi sáng/i.test(t)&&/buổi tối/i.test(t)&&/tôi sẽ/i.test(t),h:"Include at least “Buổi sáng, tôi sẽ …” and “Buổi tối, tôi sẽ …”."}];
const EX=[["nhất định phải",/nhất định phải/i],["ghé",/(^|[^\p{L}])ghé/iu],["khám phá",/khám phá/i],["nhâm nhi",/nhâm nhi/i],["đồ lưu niệm",/đồ lưu niệm/i],["di chuyển",/di chuyển/i],["tiết kiệm",/tiết kiệm/i],["gần",/(^|[^\p{L}])gần/iu],["chỉ … thôi",/chỉ.+thôi/i],["từ … đến",/từ.+đến/i]];
const pick=(a,k)=>[...a].sort(()=>Math.random()-.5).slice(0,k);
function autoQ(cats,k,form){return pick(V.filter(v=>cats.includes(v[3])),k).map(v=>{const o=pick([...V.filter(w=>w[1]!=v[1])],2).map(w=>w[1]).concat(v[1]).sort(()=>Math.random()-.5);return{q:form(v[0]),o,a:o.indexOf(v[1]),e:v[2]}})}
let S={i:-1,en:1,sc:{},dif:{},fin:"",ex:0},R={},n=0;
try{Object.assign(S,JSON.parse(localStorage.getItem("h24")||"{}"),{i:-1})}catch(e){}
const save=()=>{try{localStorage.setItem("h24",JSON.stringify({sc:S.sc,dif:S.dif,fin:S.fin,ex:S.ex}))}catch(e){}};
const sayBtn=(t,l="▶ Nghe")=>``;
function Q(it,cat){const id="q"+(++n);R[id]={...it,cat,done:0};
const body=it.free?`<textarea rows="3" placeholder="Gõ câu trả lời… (say it aloud first!)"></textarea><button data-a="chk" data-id="${id}">Check</button>`:it.ans?`<input placeholder="Gõ từ còn thiếu" autocomplete="off"><button data-a="chk" data-id="${id}">Check</button>`:it.o.map((o,i)=>`<button data-a="pick" data-id="${id}" data-i="${i}">${o}</button>`).join("");
return `<div class="q" id="${id}"><p><b>${it.q}</b></p>${it.say?`<p>${sayBtn(it.say)}</p>`:""}<div class="opts">${body}</div><div class="fb"></div></div>`}
function grade(id,ok,exp){const r=R[id],el=$("#"+id),fb=el.querySelector(".fb");
if(!r.done){(S.sc[r.cat]??={})[id]=ok?1:0;r.done=1;save()}
fb.className="fb "+(ok?"ok":"bad");fb.innerHTML=(ok?"✔ CORRECT":"✘ TRY AGAIN")+(exp?" — "+exp:"")+(ok&&r.show?`<br><span class="mut">Transcript: ${r.show}</span>`:"")+(ok&&r.ex?`<br><span class="mut">Model: ${r.ex}</span>`:"");
if(ok)el.querySelectorAll("button,input,textarea").forEach(b=>b.disabled=true)}
const norm=s=>s.toLowerCase().replace(/[.!?,]/g,"").trim();
const qs=(a,c)=>a.map(x=>Q(x,c)).join("");
const wcard=v=>`<div class="wd"><b>${v[0]}</b><br>${v[1]}<br><i class="mut">${v[2]}</i>${v[4]?`<br><span class="mut">${v[4]}</span>`:""}</div>`;
const cat=(c,t)=>`<h3>${t}</h3><div class="grid">${V.filter(v=>v[3]==c).map(wcard).join("")}</div>`;
const SEC=[
["WATCH & READ",()=>`<h2>Watch & Read</h2><p class="mut">Click highlighted words for meaning and an example. Open the original video in another tab, listen first, then read along. Open “Giải nghĩa” under each chunk for every key word explained.</p><div><button data-a="en">${S.en?"Hide":"Show"} English</button></div><div class="tip" id="tip">Click a highlighted word…</div>`+T.map((t,i)=>`<div class="ch"><span class="ts">${t[0]}</span><p class="vi">${wrap(t[1])}</p>${S.en?`<p class="en">${t[2]}</p>`:""}<button data-a="dif" data-i="${i}" class="${S.dif[i]?"on":""}">${S.dif[i]?"★ Difficult":"☆ Mark as difficult"}</button>${expl(t[1])}</div>`).join("")],
["COMPREHENSION CHECK",()=>`<h2>Comprehension Check</h2><p class="mut">Answer in Vietnamese context. Wrong? Try again.</p><h3>Level 1 – Nhớ thông tin</h3>${qs(mk(L1),"comp")}<h3>Level 2 – Đúng hay sai?</h3>${qs(mk(L2),"comp")}<h3>Level 3 – Hiểu ý</h3>${qs(mk(L3),"comp")}<h3>Level 4 – Cả câu chuyện (tự kiểm tra)</h3>`+[["Buổi sáng người nói đã làm những gì?","Người nói đi ăn phở và uống cà phê."],["Người nói đã đến những địa điểm nào?","Hàng Vải (phở Lâm), quán cà phê, kem Tràng Tiền, bưu điện / hồ Gươm."],["Video này chủ yếu nói về điều gì?","Một ngày khám phá Hà Nội: ăn uống, tham quan và di chuyển bằng Green SM."]].map(x=>`<div class="q"><b>${x[0]}</b><details><summary>Show model answer</summary>${x[1]}</details></div>`).join("")],
["KEY VOCABULARY",()=>`<h2>Key Vocabulary</h2>${cat("f","Food & drink")}${cat("h","Hanoi & tourism")}${cat("t","Transport")}${cat("m","Money & promotions")}${cat("g","Speech & connectors")}<h3>Quick check</h3>${qs(autoQ("fhtmg",5,w=>`“${w}” nghĩa là gì?`),"voc")}`],
["NATURAL VIETNAMESE",()=>`<h2>Natural Vietnamese</h2>`+V.filter(v=>v[3]=="n").map(v=>`<div class="wd" style="margin:8px 0"><b>${v[0]}</b> → ${v[1]}<br><i>${v[2]}</i><br><span class="mut">${v[4]}</span></div>`).join("")+`<h3>Quick check</h3>${qs(autoQ("n",5,w=>`Ý nghĩa của “${w}” là gì?`),"nat")}`],
["SPEAKING PRACTICE",()=>`<h2>Speaking Practice</h2><p class="mut">Say your answer aloud first, then type it to check the pattern.</p>${qs(SK.map(s=>({...s,free:1})),"spk")}`],
["FINAL CHALLENGE",()=>`<h2>Thiết kế 24 giờ ở Hà Nội của bạn</h2><p>Choose 3–5 places, at least 2 foods/drinks, how you travel, and use at least 5 expressions.</p><textarea id="fc" rows="8" style="width:100%;box-sizing:border-box;padding:8px;background:var(--card);border:1px solid var(--grn)">${S.fin}</textarea><p id="fcs"></p>`],
["REVIEW",()=>review()]];
const cnt=c=>Object.values(S.sc[c]||{}).reduce((a,b)=>a+b,0),did=c=>Object.keys(S.sc[c]||{}).length;
function scores(){return[["Comprehension",did("comp")?Math.round(cnt("comp")/18*10):null,"Story details – re-read Watch & Read and replay the clips."],["Vocabulary",did("voc")?cnt("voc")*2:null,"Money expressions and transport vocabulary (Sections 3 and 6)."],["Natural Vietnamese",did("nat")?cnt("nat")*2:null,"Expressions like “sương sương”, “gần hai củ”, “no đến chiều” (Section 4)."],["Speaking",did("spk")||S.ex?cnt("spk")+Math.min(5,S.ex):null,"Use patterns from Section 8 in your own sentences."]]}
function review(){const sc=scores(),low=sc.filter(s=>s[1]==null||s[1]<7),dif=Object.keys(S.dif).filter(k=>S.dif[k]);
return `<h2>Review & Progress</h2>`+sc.map(s=>`<div class="sc"><span>${s[0]}</span><span><i style="width:${(s[1]||0)*10}%"></i></span><b>${s[1]==null?"–":s[1]+"/10"}</b></div>`).join("")+`<h3>Your review areas</h3>`+(low.length?"<ul>"+low.map(s=>`<li>${s[1]==null?`<b>${s[0]}</b>: not tried yet.`:`<b>${s[0]}</b>: ${s[2]}`}</li>`).join("")+"</ul>":"<p>Strong across the board. Try the Final Challenge again with new places.</p>")+(dif.length?`<h3>Chunks you marked difficult</h3>`+dif.map(k=>`<div class="ch"><span class="ts">${T[k][0]}</span> ${T[k][1]}</div>`).join(""):"")+`<h3>What you learned</h3><p>Hanoi food · Hanoi coffee culture · landmarks · transport · money expressions · natural spoken Vietnamese · sentence patterns</p><button data-a="reset">Reset progress</button>`}
function render(){R={};const a=$("#app");
if(S.i<0){a.innerHTML=`<h1>24 GIỜ Ở HÀ NỘI</h1><p class="mut">What would you do if you had 24 hours in Hanoi?</p><h2>Học tiếng Việt qua một video đời thường về Hà Nội</h2><p>Bạn sẽ cùng người nói khám phá Hà Nội trong 24 giờ, từ ăn phở, uống cà phê đến đi Hồ Gươm và sử dụng dịch vụ gọi xe.</p><p class="mut">Level A2–B1 · 7 sections: see it, hear it, understand it, practise it, use it.</p><button class="pri" data-a="go" data-i="0">START LESSON</button> <button class="pri" data-a="go" data-i="6">VIEW PROGRESS</button>`;return}
const i=S.i;a.innerHTML=`<div class="top"><div><b>Section ${i+1} / 7</b><select aria-label="Jump to section">${SEC.map((s,j)=>`<option value="${j}" ${j==i?"selected":""}>${j+1}. ${s[0]}</option>`).join("")}</select><button data-a="go" data-i="-1">Home</button></div><div class="pb"><i style="width:${(i+1)/7*100}%"></i></div></div>${SEC[i][1]()}<div class="foot"><button data-a="go" data-i="${i-1}" ${i?"":"disabled"}>← Back</button><button class="pri" data-a="go" data-i="${i+1}" ${i<6?"":"disabled"}>Next →</button></div>`;
if(i==5)fcUpd();window.scrollTo(0,0)}
function fcUpd(){const t=$("#fc").value,u=EX.filter(e=>e[1].test(t));S.ex=u.length;S.fin=t;save();$("#fcs").innerHTML=`<b>${u.length}/10 expressions used</b> ${u.length>=5?"✔ requirement met":"(need 5)"}<br>`+EX.map(e=>`<span class="chip ${u.includes(e)?"on":""}">${e[0]}</span>`).join("")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,d=b.dataset;
if(a=="go"){S.i=+d.i;render()}
else if(a=="en"){S.en=!S.en;const y=scrollY;render();scrollTo(0,y)}
else if(a=="dif"){S.dif[d.i]=!S.dif[d.i];save();const y=scrollY;render();scrollTo(0,y)}
else if(a=="w"){const v=V[d.k];$("#tip").innerHTML=`<b>${v[0]}</b> → ${v[1]}<br><i>${v[2]}</i>${v[4]?`<br>${v[4]}`:""}`}
else if(a=="pick"){const r=R[d.id],ok=+d.i==r.a;b.classList.add(ok?"good":"badb");grade(d.id,ok,r.e)}
else if(a=="chk"){const r=R[d.id],v=$("#"+d.id).querySelector("input,textarea").value.trim();if(!v)return;const ok=r.ans?r.ans.some(x=>norm(x)==norm(v)):r.ok(v);grade(d.id,ok,ok?"":(r.h||r.e))}
else if(a=="reset"){S={i:6,en:1,sc:{},dif:{},fin:"",ex:0};save();render()}});
document.addEventListener("change",e=>{if(e.target.matches(".top select")){S.i=+e.target.value;render()}});
document.addEventListener("input",e=>{if(e.target.id=="fc")fcUpd()});
render();
</script></body></html>
